services:
  app:
    image: php:8.3-apache
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: audimage
      DB_USER: audimage
      DB_PASS: audimage
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: >
      bash -c "docker-php-ext-install pdo_mysql &&
               docker-php-ext-configure sockets &&
               apt-get update && apt-get install -y libzip-dev &&
               pecl install redis && docker-php-ext-enable redis &&
               apache2-foreground"
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: audimage
      MYSQL_USER: audimage
      MYSQL_PASSWORD: audimage
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  db-data:
